<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lot Walk">
<meta name="theme-color" content="#070c13">
<title>Lot Walk &mdash; Walt's Auto Sales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070c13; --panel:#0b121c; --panel-2:#0d1520; --border:#182735; --border-strong:#25394a;
    --text:#EDF1F7; --text-soft:#8fa0b5; --text-faint:#59697d;
    --accent:#22D3EE; --accent-dim:rgba(34,211,238,.12); --accent-ink:#062229;
    --warn:#FBBF24; --warn-dim:rgba(251,191,36,.12);
    --danger:#FB7185; --danger-dim:rgba(251,113,133,.10);
    --good:#19D99B; --good-dim:rgba(25,217,155,.10);
    --radius:16px; --radius-sm:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
  body{padding:max(14px,env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
  .wrap{max-width:560px;margin:0 auto}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px}
  h1{font:700 24px 'Space Grotesk',sans-serif;margin:0;letter-spacing:-.01em}
  header a{color:var(--text-soft);font-size:13px;text-decoration:none}
  .status{color:var(--text-faint);font-size:12.5px;margin-bottom:14px;min-height:17px}
  .status.err{color:var(--danger)}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px}
  .stat b{display:block;font:700 22px 'Space Grotesk',sans-serif}
  .stat span{color:var(--text-soft);font-size:12px}
  .stat.good b{color:var(--good)} .stat.warn b{color:var(--warn)}
  .bar{height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden;margin-bottom:14px}
  .bar i{display:block;height:100%;width:0;background:var(--good);transition:width .3s}

  .entry{background:var(--panel);border:1px solid var(--border-strong);border-radius:var(--radius);padding:12px}
  .row{display:flex;gap:8px}
  #code{flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--border-strong);border-radius:var(--radius-sm);
        color:var(--text);font:600 26px 'JetBrains Mono',monospace;letter-spacing:.12em;padding:10px 12px;text-transform:uppercase}
  #code:focus{outline:2px solid var(--accent);outline-offset:1px}
  #code::placeholder{font:500 15px Inter,sans-serif;letter-spacing:0;color:var(--text-faint)}
  button{font:600 14px Inter,sans-serif;border-radius:var(--radius-sm);border:1px solid var(--border-strong);
         background:var(--panel-2);color:var(--text);padding:0 14px;min-height:44px;cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  #abc{min-width:56px}
  #abc.on{border-color:var(--accent);color:var(--accent)}
  .hint{color:var(--text-faint);font-size:12px;margin-top:8px}

  .result{margin-top:10px;border-radius:var(--radius-sm);padding:10px 12px;display:none}
  .result.show{display:block;animation:pop .18s ease-out}
  @keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}
  .result.good{background:var(--good-dim);border:1px solid var(--good)}
  .result.warn{background:var(--warn-dim);border:1px solid var(--warn)}
  .result.info{background:var(--accent-dim);border:1px solid var(--accent)}
  .result.bad{background:var(--danger-dim);border:1px solid var(--danger)}
  .result .head{font-weight:700;margin-bottom:2px}
  .result .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

  .matches{margin-top:8px;display:flex;flex-direction:column;gap:6px}
  .car{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--border);
       border-radius:var(--radius-sm);padding:8px 10px;text-align:left;width:100%;color:var(--text);font:inherit;min-height:0}
  .car img{width:56px;height:42px;object-fit:cover;border-radius:6px;background:#111b27;flex:none}
  .car .t{flex:1;min-width:0}
  .car .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .car .sub{color:var(--text-soft);font-size:12.5px}
  .car .l6{font:700 15px 'JetBrains Mono',monospace;color:var(--accent);flex:none}
  .car .l6 small{color:var(--text-faint);font-weight:500}
  .car .x{flex:none;min-height:32px;padding:0 10px;font-size:12px}

  .tabs{display:flex;gap:6px;margin:18px 0 10px}
  .tabs button{flex:1;min-height:38px;font-size:13px}
  .tabs button.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
  .list{display:flex;flex-direction:column;gap:6px}
  .empty{color:var(--text-faint);text-align:center;padding:18px 0;font-size:13px}
  .filter{width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius-sm);
          color:var(--text);font:14px Inter,sans-serif;padding:9px 12px;margin-bottom:8px}

  .foot{display:flex;gap:8px;margin-top:20px}
  .foot button{flex:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Lot Walk</h1>
    <a href="./">VIN Lookup &rsaquo;</a>
  </header>
  <div class="status" id="status">Loading website inventory&hellip;</div>

  <div class="stats">
    <div class="stat good"><b id="nFound">0</b><span>found</span></div>
    <div class="stat"><b id="nMissing">0</b><span>not seen yet</span></div>
    <div class="stat warn"><b id="nExtra">0</b><span>not on website</span></div>
  </div>
  <div class="bar"><i id="bar"></i></div>

  <div class="entry">
    <form class="row" id="form" autocomplete="off">
      <input id="code" inputmode="numeric" autocapitalize="characters" autocorrect="off" spellcheck="false"
             maxlength="17" placeholder="Last 6 of VIN" aria-label="Last 6 of VIN">
      <button type="button" id="abc" title="Switch to letter keyboard">ABC</button>
      <button type="submit" class="primary">Check</button>
    </form>
    <div class="matches" id="matches"></div>
    <div class="result" id="result"></div>
    <div class="hint">Tip: 4&ndash;5 digits is usually enough &mdash; tap the car when it shows. A Bluetooth scanner can scan the full VIN here too.</div>
  </div>

  <div class="tabs" role="tablist">
    <button data-tab="missing" class="on">Not seen</button>
    <button data-tab="extra">Not on website</button>
    <button data-tab="found">Found</button>
  </div>
  <input class="filter" id="filter" placeholder="Filter by stock #, model, VIN&hellip;" aria-label="Filter list">
  <div class="list" id="list"></div>

  <div class="foot">
    <button id="share">Share report</button>
    <button id="reset">New walk</button>
  </div>
</div>

<script>
(() => {
  const RAW = 'https://raw.githubusercontent.com/tangelox968/waltsauto-vin-lookup/main/inventory.json';
  const KEY = 'lotWalk.v1', INV_KEY = 'lotWalk.inventory';
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const store = {
    get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  let inv = { cars: [] };
  let walk = store.get(KEY) || newWalk();
  let tab = 'missing';
  let autoTimer = null;

  function newWalk(){ return { started: Date.now(), found: {}, extra: [] }; }
  function save(){ store.set(KEY, walk); }

  // VINs never use I, O or Q, so treat those as the 1/0 people meant.
  const clean = s => s.toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/[OQ]/g, '0').replace(/I/g, '1');
  const last6 = vin => vin.slice(-6);
  const ago = t => {
    const m = Math.round((Date.now() - t) / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + ' min ago';
    const h = Math.round(m / 60);
    return h < 48 ? h + ' hr ago' : Math.round(h / 24) + ' days ago';
  };
  const timeStr = t => new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

  async function loadInventory(){
    const cached = store.get(INV_KEY);
    if (cached) { inv = cached; render(); }
    try {
      let res = await fetch(RAW + '?t=' + Date.now(), { cache: 'no-store' }).catch(() => null);
      if (!res || !res.ok) res = await fetch('inventory.json?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      inv = await res.json();
      store.set(INV_KEY, inv);
      setStatus(`${inv.count} cars on waltsautosales.net · list updated ${ago(Date.parse(inv.checked))} · rechecks hourly`);
    } catch (e) {
      if (cached) setStatus(`Offline — using saved list from ${ago(Date.parse(cached.checked))} (${cached.count} cars)`, true);
      else setStatus('Couldn\'t load the website inventory. Check your signal and reopen.', true);
    }
    render();
  }
  function setStatus(msg, err){ const s = $('status'); s.textContent = msg; s.classList.toggle('err', !!err); }

  function carRow(c, opts = {}){
    const l6 = last6(c.vin);
    const img = c.img ? `<img src="${esc(c.img)}" alt="" loading="lazy">` : '<img alt="">';
    const tag = opts.button ? 'button type="button"' : 'div';
    const end = opts.button ? 'button' : 'div';
    return `<${tag} class="car" ${opts.attrs || ''}>${img}
      <div class="t"><div>${esc(c.title)}</div>
      <div class="sub">Stock ${esc(c.stock)} · ${esc(c.miles)} mi${opts.sub ? ' · ' + opts.sub : ''}</div></div>
      <div class="l6"><small>${esc(c.vin.slice(0, 11))}</small><br>${esc(l6)}</div>${opts.extra || ''}</${end}>`;
  }

  function candidates(code){
    if (code.length === 17) return inv.cars.filter(c => c.vin === code);
    return inv.cars.filter(c => c.vin.endsWith(code));
  }

  function showResult(kind, head, body = '', acts = ''){
    const r = $('result');
    r.className = 'result show ' + kind;
    r.innerHTML = `<div class="head">${head}</div>${body}${acts ? `<div class="acts">${acts}</div>` : ''}`;
  }

  function markFound(c, how){
    $('matches').innerHTML = '';
    if (walk.found[c.vin]) {
      showResult('info', 'Already checked off', carRow(c, { sub: 'at ' + timeStr(walk.found[c.vin].t) }));
    } else {
      walk.found[c.vin] = { t: Date.now(), how, car: c };
      save();
      showResult('good', '✓ On the website', carRow(c));
    }
    $('code').value = '';
    render();
  }

  function logExtra(code){
    $('matches').innerHTML = '';
    if (!walk.extra.some(e => e.code === code)) { walk.extra.push({ code, t: Date.now() }); save(); }
    showResult('warn', `⚠ ${esc(code)} logged as not on website`, '<div class="sub">Check it\'s typed right — you can remove it from the "Not on website" tab.</div>');
    $('code').value = '';
    render();
  }

  // Live matching while typing.
  function onType(){
    clearTimeout(autoTimer);
    const code = clean($('code').value);
    const box = $('matches');
    $('result').className = 'result';
    if (code.length < 3 || !inv.cars.length) { box.innerHTML = ''; return; }
    const m = candidates(code).slice(0, 6);
    box.innerHTML = m.map(c => carRow(c, { button: true, attrs: `data-vin="${c.vin}"`,
      sub: walk.found[c.vin] ? '<b style="color:var(--good)">already found</b>' : '' })).join('');
    if (code.length >= 6 && !m.length) {
      box.innerHTML = `<div class="result show bad"><div class="head">No car on the website ends in ${esc(code)}</div>
        <div class="acts"><button type="button" class="primary" id="logExtra">Log as not on website</button></div></div>`;
      $('logExtra').onclick = () => logExtra(code);
    }
    // Six characters with exactly one match: check it off automatically (short pause so a
    // Bluetooth scanner typing a full VIN isn't cut off at six).
    if (code.length === 6 && m.length === 1 && last6(m[0].vin) === code)
      autoTimer = setTimeout(() => markFound(m[0], 'typed'), 350);
  }

  function submit(){
    clearTimeout(autoTimer);
    const code = clean($('code').value);
    if (!code) return;
    if (code.length < 4) return showResult('bad', 'Type at least 4 characters');
    const m = candidates(code);
    if (m.length === 1) return markFound(m[0], code.length === 17 ? 'scanned' : 'typed');
    if (m.length > 1) return showResult('info', `${m.length} cars end in ${esc(code)} — tap the right one above`);
    logExtra(code);
  }

  function render(){
    const cars = inv.cars;
    const onSite = new Set(cars.map(c => c.vin));
    const foundOnSite = Object.keys(walk.found).filter(v => onSite.has(v)).length;
    const missing = cars.filter(c => !walk.found[c.vin]);
    $('nFound').textContent = foundOnSite;
    $('nMissing').textContent = missing.length;
    $('nExtra').textContent = walk.extra.length;
    $('bar').style.width = cars.length ? (100 * foundOnSite / cars.length) + '%' : 0;
    document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));

    const f = $('filter').value.trim().toUpperCase();
    const hit = c => !f || (c.title + ' ' + c.stock + ' ' + c.vin).toUpperCase().includes(f);
    let html = '';
    if (tab === 'missing') {
      html = missing.filter(hit).map(c => carRow(c, { button: true, attrs: `data-vin="${c.vin}" data-manual="1"` })).join('')
        || `<div class="empty">${cars.length ? 'Every car on the website has been found 🎉' : 'No inventory loaded yet.'}</div>`;
    } else if (tab === 'found') {
      html = Object.values(walk.found).sort((a, b) => b.t - a.t).map(x => x.car).filter(hit)
        .map(c => carRow(c, { sub: (onSite.has(c.vin) ? '' : '<b style="color:var(--warn)">no longer listed</b> · ') + timeStr(walk.found[c.vin].t),
                             extra: `<button type="button" class="x" data-undo="${c.vin}">Undo</button>` })).join('')
        || '<div class="empty">Nothing found yet. Start typing VINs above.</div>';
    } else {
      html = walk.extra.filter(e => !f || e.code.includes(f)).map((e, i) => `<div class="car"><div class="t">
          <div style="font:700 17px 'JetBrains Mono',monospace;color:var(--warn)">${esc(e.code)}</div>
          <div class="sub">Logged ${timeStr(e.t)}</div></div>
          <button type="button" class="x" data-rm="${esc(e.code)}">Remove</button></div>`).join('')
        || '<div class="empty">No cars logged that aren\'t on the website.</div>';
    }
    $('list').innerHTML = html;
  }

  function report(){
    const cars = inv.cars;
    const missing = cars.filter(c => !walk.found[c.vin]);
    const lines = [
      `Lot Walk — ${new Date(walk.started).toLocaleDateString()} (started ${timeStr(walk.started)})`,
      `Found ${cars.length - missing.length} of ${cars.length} website cars`, '',
      `NOT SEEN ON LOT (${missing.length}):`,
      ...missing.map(c => `  Stock ${c.stock} · ${c.title} · …${last6(c.vin)}`), '',
      `ON LOT BUT NOT ON WEBSITE (${walk.extra.length}):`,
      ...walk.extra.map(e => `  …${e.code}`)
    ];
    return lines.join('\n');
  }

  // Events
  $('form').addEventListener('submit', e => { e.preventDefault(); submit(); });
  $('code').addEventListener('input', onType);
  $('abc').addEventListener('click', () => {
    const el = $('code'), on = el.inputMode !== 'text';
    el.inputMode = on ? 'text' : 'numeric';
    $('abc').classList.toggle('on', on);
    $('abc').textContent = on ? '123' : 'ABC';
    el.blur(); el.focus();
  });
  $('matches').addEventListener('click', e => {
    const b = e.target.closest('[data-vin]');
    if (b) markFound(inv.cars.find(c => c.vin === b.dataset.vin), 'tapped');
  });
  $('list').addEventListener('click', e => {
    const t = e.target.closest('[data-undo],[data-rm],[data-manual]');
    if (!t) return;
    if (t.dataset.undo) { delete walk.found[t.dataset.undo]; }
    else if (t.dataset.rm) { walk.extra = walk.extra.filter(x => x.code !== t.dataset.rm); }
    else if (t.dataset.manual) {
      const c = inv.cars.find(c => c.vin === t.dataset.vin);
      if (!confirm(`Mark stock ${c.stock} (${c.title}) as found without typing the VIN?`)) return;
      walk.found[c.vin] = { t: Date.now(), how: 'manual', car: c };
    }
    save(); render();
  });
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => { tab = b.dataset.tab; render(); }));
  $('filter').addEventListener('input', render);
  $('reset').addEventListener('click', () => {
    if (!confirm('Start a new walk? This clears what you\'ve checked off.')) return;
    walk = newWalk(); save();
    $('result').className = 'result'; $('matches').innerHTML = '';
    tab = 'missing'; render(); $('code').focus();
  });
  $('share').addEventListener('click', async () => {
    const text = report();
    try {
      if (navigator.share) await navigator.share({ title: 'Lot Walk', text });
      else { await navigator.clipboard.writeText(text); showResult('info', 'Report copied — paste it into a text or email'); }
    } catch {}
  });

  loadInventory();
})();
</script>
</body>
</html>
