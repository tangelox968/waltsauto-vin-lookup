<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VIN Lookup">
<meta name="theme-color" content="#0B0F19">
<title>VIN Lookup &mdash; Walt's Auto Sales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #0b0f19;
    --card-bg: rgba(30, 41, 59, 0.7);
    --card-border: rgba(255, 255, 255, 0.08);
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --accent-glow: #10b981;
    --accent-glow-bg: rgba(16, 185, 129, 0.15);
    --accent-red: #ef4444;
    --accent-red-bg: rgba(239, 68, 68, 0.15);
    --accent-amber: #f59e0b;
    --accent-amber-bg: rgba(245, 158, 11, 0.15);
    --btn-bg: #1e293b;
    --btn-hover: #334155;
    --pad: clamp(16px, 4vw, 32px);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background-color: var(--bg-dark); color: var(--text-primary); font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  .sheet {
    max-width: 800px;
    margin: 0 auto;
    padding: max(var(--pad), env(safe-area-inset-top)) var(--pad) calc(40px + env(safe-area-inset-bottom));
  }

  .masthead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    border: 1px solid var(--card-border);
    padding: 16px 20px;
    border-radius: 16px;
    margin-bottom: 24px;
  }
  .lockup-wrap { display: flex; flex-direction: column; }
  .lockup {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 800;
    font-size: clamp(20px, 4vw, 24px);
    letter-spacing: -0.02em;
    margin: 0;
    color: #ffffff;
  }
  .eyebrow {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  .entry {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 20px;
    backdrop-filter: blur(12px);
  }
  label.field-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin-bottom: 10px;
  }
  .vin-wrap { position: relative; width: 100%; margin-bottom: 14px; }
  #vin {
    width: 100%;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 16px 80px 16px 16px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: clamp(16px, 3.5vw, 22px);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #ffffff;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #vin::placeholder { color: #475569; letter-spacing: 0.1em; }
  #vin:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }
  
  .count {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .count.full { color: #38bdf8; font-weight: 700; }

  .action-row { display: flex; gap: 10px; flex-wrap: wrap; }
  button.action-btn {
    flex: 1;
    min-width: 100px;
    padding: 12px 16px;
    background: var(--btn-bg);
    color: #ffffff;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s;
  }
  button.action-btn:hover:not(:disabled) { background: var(--btn-hover); }
  button.action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #decode { background: #2563eb; border-color: #3b82f6; }
  #decode:hover:not(:disabled) { background: #1d4ed8; }

  .hint { margin: 12px 0 0; font-size: 13px; color: var(--text-secondary); }
  .hint.warn { color: var(--accent-red); }
  .hint.ok { color: var(--accent-glow); }

  .results { margin-top: 24px; display: none; }
  .results.shown { display: block; }
  .results-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .headline {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    font-size: clamp(22px, 5vw, 32px);
    margin: 0;
    color: #ffffff;
  }
  .stamp {
    background: var(--accent-glow-bg);
    color: var(--accent-glow);
    font-size: 12px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid rgba(16, 185, 129, 0.3);
  }

  dl.specs {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin: 0 0 24px 0;
  }
  .spec {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .spec dt {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .spec dd { margin: 0; font-size: 15px; font-weight: 600; color: #ffffff; word-break: break-word; }

  .recalls-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 20px;
    margin-top: 24px;
  }
  .recalls-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .recalls-title {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 18px;
    font-weight: 700;
    margin: 0;
    color: #ffffff;
  }
  .badge {
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 700;
  }
  .badge.none { background: var(--accent-glow-bg); color: var(--accent-glow); border: 1px solid rgba(16, 185, 129, 0.3); }
  .badge.found { background: var(--accent-red-bg); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.3); }

  .recall-item {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .recall-item:last-child { margin-bottom: 0; }
  .recall-name {
    font-weight: 700;
    font-size: 15px;
    color: #f8fafc;
    margin: 0 0 8px 0;
  }
  .recall-detail {
    font-size: 13px;
    color: #cbd5e1;
    line-height: 1.5;
    margin: 4px 0;
  }
  .recall-meta {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 8px;
    font-family: 'JetBrains Mono', monospace;
  }

  .meta-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 20px;
    margin-top: 16px;
  }
  .meta-row { display: flex; gap: 20px; flex-wrap: wrap; }
  .odo-block, .trim-block { flex: 1; min-width: 200px; }
  
  .text-field {
    width: 100%;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    color: #ffffff;
  }
  .text-field:focus { outline: none; border-color: #38bdf8; }

  .odo {
    display: inline-flex;
    gap: 4px;
    padding: 8px;
    background: #000000;
    border-radius: 8px;
    border: 1px solid #334155;
    position: relative;
  }
  .digit {
    width: 28px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1e293b;
    color: #ffffff;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 20px;
    border-radius: 4px;
  }
  .digit.lead { color: #475569; }
  .digit.tenth { background: #331010; color: var(--accent-red); }
  #miles { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: text; }

  .actions { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .ghost {
    background: var(--btn-bg);
    color: #ffffff;
    border: 1px solid var(--card-border);
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
  }
  .ghost:hover { background: var(--btn-hover); }
  .summary {
    margin-top: 16px;
    background: #0f172a;
    border-left: 4px solid #38bdf8;
    border-radius: 0 8px 8px 0;
    padding: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: #cbd5e1;
    word-break: break-word;
  }
  .toast { font-size: 13px; color: var(--accent-glow); opacity: 0; transition: opacity 0.2s; }
  .toast.on { opacity: 1; }

  .scanner { display: none; margin-top: 16px; background: #000; border-radius: 12px; padding: 12px; }
  .scanner.open { display: block; }
  .viewport { position: relative; width: 100%; aspect-ratio: 4/3; border-radius: 8px; overflow: hidden; }
  .viewport video { width: 100%; height: 100%; object-fit: cover; }
  .aim { position: absolute; left: 10%; right: 10%; top: 50%; height: 2px; background: var(--accent-red); box-shadow: 0 0 8px var(--accent-red); }

  footer { margin-top: 40px; text-align: center; font-size: 12px; color: var(--text-secondary); }
</style>
</head>
<body>
<main class="sheet">

  <header class="masthead">
    <div class="lockup-wrap">
      <h1 class="lockup">Walt's Auto</h1>
      <span class="eyebrow">San Angelo, TX &middot; VIN Lookup & Recall Checker</span>
    </div>
  </header>

  <section class="entry">
    <label class="field-label" for="vin">Vehicle Identification Number</label>
    <div class="vin-wrap">
      <input id="vin" type="text" spellcheck="false" autocomplete="off"
             autocorrect="off" autocapitalize="characters"
             maxlength="17" placeholder="1FTEW1EP7JF..." aria-describedby="vin-hint">
      <span class="count" id="count" aria-hidden="true">0 / 17</span>
    </div>
    
    <div class="action-row">
      <button class="action-btn" id="scan" type="button" hidden>📷 Scan</button>
      <button class="action-btn" id="decode" type="button" disabled>Decode & Check Recalls</button>
    </div>
    <p class="hint" id="vin-hint" role="status">Type or paste the VIN off the door jamb, dash, or title.</p>

    <div class="scanner" id="scanner">
      <div class="viewport">
        <video id="video" playsinline autoplay muted></video>
        <div class="aim" aria-hidden="true"></div>
      </div>
      <div class="actions" style="justify-content:space-between;">
        <span style="font-size:12px; color:#94a3b8;" id="scan-note">Center barcode along red line</span>
        <button class="ghost" id="stopscan" type="button">Cancel</button>
      </div>
    </div>
  </section>

  <section class="results" id="results" aria-live="polite">
    <div class="results-head">
      <h2 class="headline" id="headline">&nbsp;</h2>
      <span class="stamp" id="checkstamp" hidden>Check Digit OK</span>
    </div>

    <dl class="specs" id="specs"></dl>

    <div class="recalls-card">
      <div class="recalls-header">
        <h3 class="recalls-title">Safety Recalls</h3>
        <span class="badge" id="recall-badge">Checking...</span>
      </div>
      <div id="recalls-list"></div>
    </div>

    <div class="meta-card">
      <div class="meta-row">
        <div class="odo-block">
          <label class="field-label" for="miles">Odometer Reading</label>
          <div class="odo" id="odo">
            <span class="digit lead">0</span><span class="digit lead">0</span><span class="digit lead">0</span><span class="digit lead">0</span><span class="digit lead">0</span><span class="digit tenth">0</span>
            <input id="miles" type="text" inputmode="numeric" autocomplete="off" maxlength="6" aria-label="Odometer reading in miles">
          </div>
        </div>

        <div class="trim-block">
          <label class="field-label" for="trim">Trim / Package (Optional)</label>
          <input id="trim" class="text-field" type="text" autocomplete="off" maxlength="60" placeholder="XLT, Z71, Sport...">
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="ghost" id="copy" type="button">Copy Summary</button>
      <button class="ghost" id="print" type="button">Print</button>
      <button class="ghost" id="reset" type="button">Clear</button>
      <span class="toast" id="toast">Copied to clipboard</span>
    </div>
    <p class="summary" id="summary"></p>
  </section>

  <footer>Vehicle & Recall data provided via NHTSA vPIC API</footer>
</main>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
(function(){
  const vin      = document.getElementById('vin');
  const count    = document.getElementById('count');
  const decodeBtn= document.getElementById('decode');
  const hint     = document.getElementById('vin-hint');
  const results  = document.getElementById('results');
  const headline = document.getElementById('headline');
  const stamp    = document.getElementById('checkstamp');
  const specs    = document.getElementById('specs');
  const miles    = document.getElementById('miles');
  const odo      = document.getElementById('odo');
  const trimIn   = document.getElementById('trim');
  const digits   = Array.from(odo.querySelectorAll('.digit'));
  const summary  = document.getElementById('summary');
  const toast    = document.getElementById('toast');
  const recallBadge = document.getElementById('recall-badge');
  const recallsList = document.getElementById('recalls-list');

  let current = null;

  const VALS = {A:1,B:2,C:3,D:4,E:5,F:6,G:7,H:8,J:1,K:2,L:3,M:4,N:5,P:7,R:9,S:2,T:3,U:4,V:5,W:6,X:7,Y:8,Z:9};
  const WEIGHTS = [8,7,6,5,4,3,2,10,0,9,8,7,6,5,4,3,2];
  function checkDigitValid(v){
    if(v.length !== 17) return false;
    let sum = 0;
    for(let i=0;i<17;i++){
      const c = v[i];
      const val = /\d/.test(c) ? Number(c) : VALS[c];
      if(val === undefined) return false;
      sum += val * WEIGHTS[i];
    }
    const expect = sum % 11;
    const actual = v[8] === 'X' ? 10 : Number(v[8]);
    return expect === actual;
  }

  function cleanVin(s){
    return s.toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/[IOQ]/g,'').slice(0,17);
  }
  function syncVin(){
    const v = vin.value;
    count.textContent = v.length + ' / 17';
    count.classList.toggle('full', v.length === 17);
    decodeBtn.disabled = v.length !== 17;
    if(v.length === 17 && !checkDigitValid(v)){
      hint.textContent = 'That VIN fails its check digit — double-check your typing.';
      hint.className = 'hint warn';
    } else if(v.length === 17){
      hint.textContent = 'Check digit valid. Press Decode.';
      hint.className = 'hint ok';
    } else {
      hint.textContent = 'Type or paste the VIN off the door jamb, dash, or title.';
      hint.className = 'hint';
    }
  }
  vin.addEventListener('input', () => { vin.value = cleanVin(vin.value); syncVin(); });
  vin.addEventListener('keydown', e => { if(e.key === 'Enter' && !decodeBtn.disabled) run(); });

  function syncOdo(){
    const raw = miles.value.replace(/\D/g,'').slice(0,6);
    miles.value = raw;
    const padded = raw.padStart(6,'0');
    let leading = true;
    digits.forEach((d,i) => {
      d.textContent = padded[i];
      if(padded[i] !== '0') leading = false;
      d.classList.toggle('lead', leading && i < 5);
    });
    writeSummary();
  }
  miles.addEventListener('input', syncOdo);
  odo.addEventListener('click', () => miles.focus());
  trimIn.addEventListener('input', writeSummary);

  const FIELDS = [
    ['Trim','Trim'],
    ['Body','BodyClass'],
    ['Doors','Doors'],
    ['Engine','__engine'],
    ['Cylinders','EngineCylinders'],
    ['Fuel','FuelTypePrimary'],
    ['Drive','DriveType'],
    ['Transmission','__trans'],
    ['Series','Series'],
    ['Built in','__plant'],
    ['GVWR','GVWR']
  ];

  async function fetchRecalls(v){
    recallBadge.textContent = 'Checking...';
    recallBadge.className = 'badge';
    recallsList.innerHTML = '';
    
    try {
      const targetApi = `https://api.nhtsa.gov/recalls/recallsByVin?vin=${v}&format=json`;
      const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetApi)}`;
      
      const res = await fetch(proxyUrl);
      if(!res.ok) throw new Error('Recall API error');
      const data = await res.json();
      const list = data.results || [];

      if(list.length === 0){
        recallBadge.textContent = '0 Open Recalls';
        recallBadge.className = 'badge none';
        recallsList.innerHTML = '<p class="recall-detail" style="color:#94a3b8;">No unrepaired safety recalls found for this VIN via NHTSA database.</p>';
      } else {
        recallBadge.textContent = list.length + ' Recall(s) Found';
        recallBadge.className = 'badge found';
        list.forEach(item => {
          const card = document.createElement('div');
          card.className = 'recall-item';
          card.innerHTML = `
            <div class="recall-name">${item.Component || 'Safety Recall'}</div>
            <div class="recall-detail"><strong>Summary:</strong> ${item.Summary || 'N/A'}</div>
            <div class="recall-detail"><strong>Consequence:</strong> ${item.Conequence || item.Consequence || 'N/A'}</div>
            <div class="recall-detail"><strong>Remedy:</strong> ${item.Remedy || 'N/A'}</div>
            <div class="recall-meta">NHTSA Campaign #${item.NHTSACampaignNumber || 'Unknown'} &middot; Date: ${item.ReportReceivedDate || 'N/A'}</div>
          `;
          recallsList.appendChild(card);
        });
      }
    } catch(err) {
      recallBadge.textContent = 'Lookup Unavailable';
      recallBadge.className = 'badge';
      recallsList.innerHTML = '<p class="recall-detail" style="color:#ef4444;">Unable to load recall status. Check connection.</p>';
    }
  }

  async function run(){
    const v = vin.value;
    decodeBtn.disabled = true;
    decodeBtn.textContent = 'Reading...';
    hint.textContent = 'Checking vehicle specs and recall data...';
    hint.className = 'hint';
    try{
      const res = await fetch('https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/' + v + '?format=json');
      if(!res.ok) throw new Error('status ' + res.status);
      const data = await res.json();
      const r = data.Results && data.Results[0];
      if(!r || (!r.Make && !r.ModelYear)) throw new Error('empty');
      render(v, r);
      fetchRecalls(v);
      hint.textContent = '';
    }catch(err){
      results.classList.remove('shown');
      hint.textContent = (err.message === 'empty')
        ? 'NHTSA returned no data for that VIN.'
        : 'Could not connect to database. Check internet connection.';
      hint.className = 'hint warn';
    }finally{
      decodeBtn.textContent = 'Decode & Check Recalls';
      decodeBtn.disabled = vin.value.length !== 17;
    }
  }
  decodeBtn.addEventListener('click', run);

  function render(v, r){
    const engine = [
      r.DisplacementL ? (Math.round(Number(r.DisplacementL) * 10) / 10).toFixed(1) + 'L' : '',
      r.EngineConfiguration && r.EngineCylinders ? r.EngineConfiguration.replace('V-Shaped','V').replace('In-Line','I') + r.EngineCylinders : '',
      r.EngineHP ? r.EngineHP + ' hp' : ''
    ].filter(Boolean).join(' ');
    const trans = [r.TransmissionStyle, r.TransmissionSpeeds ? r.TransmissionSpeeds + '-speed' : '']
      .filter(Boolean).join(' ');
    const plant = [r.PlantCity, r.PlantCountry].filter(Boolean).join(', ');
    const extra = {__engine:engine, __trans:trans, __plant:plant};

    current = {
      vin:v,
      year:r.ModelYear || '',
      make:r.Make || '',
      model:r.Model || '',
      trim:r.Trim || r.Series || '',
      body:r.BodyClass || '',
      engine:engine,
      drive:r.DriveType || ''
    };

    headline.textContent = [r.ModelYear, r.Make, r.Model].filter(Boolean).join(' ') || 'Vehicle';

    specs.innerHTML = '';
    FIELDS.forEach(([label,key]) => {
      const val = key.startsWith('__') ? extra[key] : r[key];
      if(!val || String(val).trim() === '' || val === 'Not Applicable') return;
      const wrap = document.createElement('div');
      wrap.className = 'spec';
      const dt = document.createElement('dt'); dt.textContent = label;
      const dd = document.createElement('dd'); dd.textContent = val;
      wrap.append(dt, dd);
      specs.append(wrap);
    });
    const wrap = document.createElement('div');
    wrap.className = 'spec';
    const dt = document.createElement('dt'); dt.textContent = 'VIN';
    const dd = document.createElement('dd'); dd.textContent = v;
    wrap.append(dt, dd);
    specs.append(wrap);

    stamp.hidden = !checkDigitValid(v);
    trimIn.value = current.trim;
    results.classList.add('shown');
    syncOdo();
  }

  function writeSummary(){
    if(!current){ summary.textContent = ''; return; }
    const m = miles.value.replace(/\D/g,'');
    const typedTrim = trimIn.value.trim();
    const parts = [
      [current.year, current.make, current.model, typedTrim].filter(Boolean).join(' '),
      current.body,
      current.engine,
      current.drive,
      m ? Number(m).toLocaleString('en-US') + ' miles' : 'mileage not entered',
      'VIN ' + current.vin
    ].filter(Boolean);
    summary.textContent = parts.join(' · ');
  }

  document.getElementById('copy').addEventListener('click', async () => {
    if(!summary.textContent) return;
    try{
      await navigator.clipboard.writeText(summary.textContent);
      toast.textContent = 'Copied to clipboard';
    }catch(e){
      toast.textContent = 'Copy failed';
    }
    toast.classList.add('on');
    setTimeout(() => toast.classList.remove('on'), 1600);
  });

  document.getElementById('print').addEventListener('click', () => window.print());

  document.getElementById('reset').addEventListener('click', () => {
    stopScan();
    vin.value = ''; miles.value = ''; trimIn.value = ''; current = null;
    results.classList.remove('shown');
    specs.innerHTML = ''; summary.textContent = '';
    recallsList.innerHTML = '';
    syncVin(); syncOdo(); vin.focus();
  });

  const scanBtn  = document.getElementById('scan');
  const stopBtn  = document.getElementById('stopscan');
  const scanner  = document.getElementById('scanner');
  const video    = document.getElementById('video');
  const scanNote = document.getElementById('scan-note');
  const VIN_RE   = /[A-HJ-NPR-Z0-9]{17}/;
  let reader = null;

  const cameraReady = typeof ZXing !== 'undefined' && navigator.mediaDevices && typeof navigator.mediaDevices.getUserMedia === 'function';
  if(cameraReady) scanBtn.hidden = false;

  function stopScan(){
    if(reader){ reader.reset(); reader = null; }
    scanner.classList.remove('open');
    scanBtn.textContent = '📷 Scan';
  }

  async function startScan(){
    if(reader){ stopScan(); return; }
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
      ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.CODE_128,
      ZXing.BarcodeFormat.DATA_MATRIX
    ]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

    reader = new ZXing.BrowserMultiFormatReader(hints);
    scanner.classList.add('open');
    scanBtn.textContent = 'Close';
    try{
      await reader.decodeFromConstraints(
        { video:{ facingMode:{ ideal:'environment' } } },
        video,
        (result) => {
          if(!result) return;
          const text = result.getText().toUpperCase().replace(/[^A-Z0-9]/g,'');
          const match = text.match(VIN_RE);
          if(!match) return;
          vin.value = cleanVin(match[0]);
          stopScan();
          syncVin();
          if(vin.value.length === 17) run();
        }
      );
    }catch(err){
      stopScan();
    }
  }

  scanBtn.addEventListener('click', startScan);
  stopBtn.addEventListener('click', stopScan);
  window.addEventListener('pagehide', stopScan);

  syncVin(); syncOdo();
})();
</script>
</body>
</html>
